      - name: Save received text
        env:
          VOICE_TEXT: ${{ inputs.text }}
        run: |
          printf '%s' "$VOICE_TEXT" > received_text.txt

      - name: Upload received text
        uses: actions/upload-artifact@v4
        with:
          name: received-text
          path: received_text.txt

      - name: Generate voice
        env:
          VOICE_TEXT: ${{ inputs.text }}
        run: |
          printf '%s' "$VOICE_TEXT" | python -m piper \
            -m en_US-lessac-medium \
            -f voice.wav

          echo "Received text length: ${#VOICE_TEXT}"

          printf '%s' "$VOICE_TEXT" | python -m piper \
            -m en_US-lessac-medium \
            -f voice.wav

          test -s voice.wav
          echo "Voice generated successfully"

      - name: Upload audio
        uses: actions/upload-artifact@v4
        with:
          name: voice-audio
          path: voice.wav
          if-no-files-found: error
